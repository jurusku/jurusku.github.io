<title>JURUSKU - JUrnal RUtin Siswa & e-buKU</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #1db954;
    --primary-dark: #15803d;
    --text-main: #1e293b;
    --text-muted: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at top right, #e8f5e9, #ffffff), radial-gradient(circle at bottom left, #f0fdf4, #ffffff);
    animation: bgNyala 1.5s infinite alternate ease-in-out;
}
@keyframes bgNyala { 0% { background-color:#ffffff; } 100% { background-color:#fff9e6; box-shadow: inset 0 0 100px rgba(253,203,110,.15); } }
.wrapper {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:10; width:100%; max-width:450px; padding:20px;
    max-height:100vh; overflow-y:auto;
}
.main-logo { width:100px; margin-bottom:20px; filter:drop-shadow(0 10px 15px rgba(0,0,0,.05)); animation: floating 4s ease-in-out infinite; }
h1 {
    font-family:'Fredoka', sans-serif; font-size:4rem; line-height:1; margin-bottom:5px; letter-spacing:-2px;
    background: linear-gradient(90deg, #1db954, #00b894, #0984e3, #1db954); background-size:200% auto;
    color:transparent; -webkit-background-clip:text; background-clip:text; animation: teksKilau 4s linear infinite;
}
.subtitle-main { font-family:'Tahoma', sans-serif; font-size:1.1rem; color:var(--text-main); font-weight:bold; margin-bottom:8px; letter-spacing:.5px; }
.school-name { font-size:.85rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:3px; margin-bottom:30px; }
.button-group { display:flex; flex-direction:column; gap:15px; width:100%; }
.btn-main {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; padding:18px; border-radius:20px;
    font-family:'Fredoka', sans-serif; font-size:1.4rem; border:none; cursor:pointer;
    box-shadow: 0 10px 25px rgba(29,185,84,.3); transition:.3s cubic-bezier(.175,.885,.32,1.275);
}
.btn-main:active { transform: scale(.96); }
.sub-buttons { display:flex; gap:12px; }
.btn-small {
    flex:1; background: rgba(255,255,255,.6); backdrop-filter: blur(10px); color:var(--text-main);
    padding:14px; border-radius:18px; font-weight:700; font-size:.85rem; border:1px solid rgba(0,0,0,.05); cursor:pointer; transition:.2s;
}
.btn-small:hover { border-color:var(--primary); color:var(--primary); }
@keyframes teksKilau { 0% { background-position:0% center; } 100% { background-position:200% center; } }
@keyframes floating { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.bg-blob {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:400px; height:400px;
    background: var(--primary); filter: blur(100px); opacity:.08; z-index:1; border-radius:50%;
}
.tools-toggle {
    margin-top: 22px; background:none; border:none; color:var(--text-muted); font-size:.75rem;
    font-weight:700; letter-spacing:.5px; cursor:pointer; text-decoration:underline;
}
.tools-panel {
    display:none; margin-top:14px; padding-top:14px; border-top:1px dashed rgba(0,0,0,.1);
    flex-direction:column; gap:8px;
}
.tools-panel.open { display:flex; }
.btn-tool {
    background: rgba(255,255,255,.5); backdrop-filter: blur(10px); color:var(--text-main);
    padding:10px; border-radius:14px; font-weight:600; font-size:.78rem; border:1px solid rgba(0,0,0,.05);
    cursor:pointer; text-align:left;
}
.btn-tool:hover { border-color:var(--primary); color:var(--primary); }
#app-frame {
    position:fixed; top:0; left:0; width:100vw; height:100vh; border:none; z-index:9999; display:none; background:#fff;
}
#close-frame-btn {
    position:fixed; top:10px; right:10px; z-index:10000; display:none;
    background: rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%;
    width:34px; height:34px; font-size:16px; cursor:pointer; line-height:34px;
}
</style>
</head>

function b64ToUtf8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
}

function openPage(key) {
    if (key === 'home') { goHome(); return; }
    const html = PAGES_B64[key];
    if (!html) { console.error('Halaman tidak ditemukan:', key); return; }
    const frame = document.getElementById('app-frame');
    const landing = document.getElementById('landing-page');
    const closeBtn = document.getElementById('close-frame-btn');
    frame.srcdoc = b64ToUtf8(html);
    frame.style.display = 'block';
    closeBtn.style.display = 'block';
    landing.style.display = 'none';
}

function goHome() {
    const frame = document.getElementById('app-frame');
    const landing = document.getElementById('landing-page');
    const closeBtn = document.getElementById('close-frame-btn');
    frame.style.display = 'none';
    frame.srcdoc = '';
    closeBtn.style.display = 'none';
    landing.style.display = 'block';
}

// Izinkan halaman di dalam iframe memanggil parent.openPage(...) / parent.goHome()
window.openPage = openPage;
window.goHome = goHome;
</script>
