<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Asesmen Siswa - SMP Negeri 3 Babat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: #f0f4ff;
            background-image: radial-gradient(at 0% 0%, #ffdee9 0, transparent 50%), radial-gradient(at 100% 0%, #b5fffc 0, transparent 50%), radial-gradient(at 50% 100%, #fff5bc 0, transparent 50%);
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden;
        }

        #toast-container { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 999999; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; 
        }
        
        .toast {
            background: rgba(45, 52, 54, 0.95); backdrop-filter: blur(12px); color: white; padding: 16px 20px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 12px; text-align: center; pointer-events: auto;
            animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast-msg { line-height: 1.4; }
        .toast-input { padding: 10px; border-radius: 8px; border: none; width: 100%; margin-bottom: 5px; text-align: center; font-weight: bold; font-size: 1rem; color: #2d3436; outline: none; }
        .toast-actions { display: flex; gap: 10px; justify-content: center; }

        .toast-btn {
            padding: 8px 20px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none;
            transition: transform 0.2s ease;
        }
        .toast-btn:active { transform: scale(0.95); }
        .btn-yes { background: #ff7675; color: white; }
        .btn-no { background: #dfe6e9; color: #2d3436; }
        .btn-ok { background: #0984e3; color: white; width: 100%; }

        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .main-wrapper { 
            width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%); padding: 25px 20px; border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 1px solid rgba(255, 255, 255, 0.6); text-align: center;
            max-height: 95vh; display: flex; flex-direction: column;
        }

        header {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            padding-bottom: 10px; margin-bottom: 20px; border-bottom: 3px double #2D3436; flex-shrink: 0;
        }

        .header-logo { width: 55px; height: 55px; object-fit: contain; }
        .header-text-group { display: flex; flex-direction: column; text-align: center; flex: 1; }

        header h1 { font-weight: 800; font-size: 1.05rem; text-transform: uppercase; color: #2D3436; line-height: 1.2; }
        header h3 { font-size: 1.2rem; font-weight: 800; color: #2D3436; margin: 2px 0; }
        header p { font-size: 0.85rem; color: #2D3436; font-weight: 600; letter-spacing: 1px; }

        .menu-container { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 2px; }
        .menu-container::-webkit-scrollbar { width: 4px; }
        .menu-container::-webkit-scrollbar-thumb { background: #dfe6e9; border-radius: 10px; }

        .menu-card {
            display: flex; align-items: center; padding: 16px; border-radius: 20px; background: white;
            border: 1px solid #f0f0f0; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); width: 100%; text-align: left;
        }
        .menu-card:active { transform: scale(0.97); }

        .icon { width: 50px; height: 50px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; font-weight: 800; color: white; flex-shrink: 0; }
        .content { flex-grow: 1; margin-left: 15px; text-align: left; overflow: hidden; }
        .content h2 { font-size: 1.05rem; font-weight: 700; color: #2D3436; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .arrow { color: #DFE6E9; font-size: 1.1rem; flex-shrink: 0; }
        
        .c-7 .icon { background: linear-gradient(135deg, #FF9F43, #FF6B6B); }
        .c-8 .icon { background: linear-gradient(135deg, #4834D4, #686DE0); }
        .c-9 .icon { background: linear-gradient(135deg, #27AE60, #2ECC71); }
        .c-mapel .icon { background: #F1F2F6; box-shadow: none; font-size: 1.5rem; color: #2D3436; }

        .btn-back { 
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px); color: #4834D4;
            border: 1px solid rgba(255, 255, 255, 0.8); padding: 14px; border-radius: 20px; font-size: 1rem; 
            cursor: pointer; font-weight: 700; margin-top: 15px; width: 100%; 
            box-shadow: 0 5px 20px rgba(31, 38, 135, 0.08); transition: all 0.3s ease; flex-shrink: 0;
        }
        .btn-back:active { transform: scale(0.96); }

        #view-exam {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; z-index: 9999; display: flex; flex-direction: column;
        }
        .exam-header {
            background: #2D3436; color: white; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .exam-header h3 { font-size: 0.95rem; font-weight: 600; }
        .btn-close-exam {
            background: #e74c3c; color: white; border: none; padding: 6px 14px;
            border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
        }
        #exam-frame { width: 100%; flex-grow: 1; border: none; }

        #lock-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 30px;
        }
        #lock-overlay h2 { font-size: 1.5rem; margin-bottom: 10px; color: #ff7675; }
        #lock-overlay p { font-size: 0.95rem; margin-bottom: 20px; color: #dfe6e9; max-width: 400px; line-height: 1.5; }
        .btn-lock {
            background: linear-gradient(135deg, #0984e3, #74b9ff); color: white; border: none;
            padding: 14px 28px; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 8px 25px rgba(9, 132, 227, 0.4);
        }

        .hidden { display: none !important; }
        .animate-view { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div id="lock-overlay">
        <h2>⚠ Peringatan ⚠🔒 Portal Asesmen</h2>
        <p>
<br>🔒 Tidak bisa membuka aplikasi lain
<br>🔒 Tidak bisa membuka dua layar
<br>⛔ Tidak bisa keluar aplikasi tanpa TOKEN
<br>✅ Kerjakan dengan jujur</p>
        <button class="btn-lock" onclick="requestFullScreen()">Mulai Ujian</button>
    </div>

    <div class="main-wrapper">
        <header>
            <img src="logo.ico" alt="Logo" class="header-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><rect width=\'50\' height=\'50\' fill=\'%23dfe6e9\' rx=\'10\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'central\' text-anchor=\'middle\' font-size=\'20\' font-weight=\'bold\' fill=\'%232d3436\'>3B</text></svg>'">
            <div class="header-text-group">
                <h1 id="main-title">Penilaian Asesmen Tengah Semester</h1>
                <h3 id="school-name">SMP Negeri 3 Babat</h3>
                <p id="main-desc">TP 2026/2027</p>
            </div>
        </header>

        <nav id="view-class" class="menu-container animate-view">
            <button class="menu-card c-7" onclick="showMapel('7')">
                <div class="icon">7</div>
                <div class="content"><h2>Kelas VII</h2></div>
                <div class="arrow">➜</div>
            </button>
            <button class="menu-card c-8" onclick="showMapel('8')">
                <div class="icon">8</div>
                <div class="content"><h2>Kelas VIII</h2></div>
                <div class="arrow">➜</div>
            </button>
            <button class="menu-card c-9" onclick="showMapel('9')">
                <div class="icon">9</div>
                <div class="content"><h2>Kelas IX</h2></div>
                <div class="arrow">➜</div>
            </button>
        </nav>

        <nav id="view-mapel" class="menu-container hidden">
            <div id="mapel-list" class="menu-container" style="max-height: 50vh;"></div>
            <button class="btn-back" onclick="showClass()">Kembali ke Pilih Kelas</button>
        </nav>
    </div>

    <div id="view-exam" class="hidden">
        <div class="exam-header">
            <h3 id="exam-title-bar">Sedang Mengerjakan Ujian...</h3>
            <button class="btn-close-exam" onclick="confirmCloseExam()">Keluar Ujian</button>
        </div>
        <iframe id="exam-frame" src=""></iframe>
    </div>

    <script>
        const FIREBASE_URL = "https://linke-asesmen-default-rtdb.asia-southeast1.firebasedatabase.app/asesmen.json";
        let isExamActive = false;
        let currentExamToken = ""; // Variable untuk menyimpan token mapel saat ini
        let initialInnerHeight = window.innerHeight; // Acuan tinggi layar awal

        // Fungsi untuk membersihkan seluruh toast aktif
        function clearAllToasts() {
            const container = document.getElementById('toast-container');
            if (container) {
                container.innerHTML = '';
            }
        }

        function showToast(message, type = 'info', onYes = null) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';

            let actionsHtml = `<button class="toast-btn btn-ok" onclick="this.closest('.toast').remove()">OK</button>`;
            
            if (type === 'confirm') {
                actionsHtml = `
                    <div class="toast-actions">
                        <button class="toast-btn btn-yes" id="toast-yes">IYA</button>
                        <button class="toast-btn btn-no" id="toast-no">TIDAK</button>
                    </div>
                `;
            } else if (type === 'prompt') {
                actionsHtml = `
                    <input type="text" class="toast-input" id="toast-input" placeholder="Masukkan Token">
                    <div class="toast-actions">
                        <button class="toast-btn btn-yes" id="toast-submit">SUBMIT</button>
                        <button class="toast-btn btn-no" id="toast-cancel">BATAL</button>
                    </div>
                `;
            }

            toast.innerHTML = `<div class="toast-msg">${message}</div>${actionsHtml}`;
            container.appendChild(toast);

            if (type === 'confirm' && onYes) {
                toast.querySelector('#toast-yes').onclick = () => {
                    toast.remove();
                    onYes();
                };
                toast.querySelector('#toast-no').onclick = () => {
                    toast.remove();
                };
            } else if (type === 'prompt' && onYes) {
                const input = toast.querySelector('#toast-input');
                input.focus(); // Fokus ke input box
                toast.querySelector('#toast-submit').onclick = () => {
                    const val = input.value;
                    toast.remove();
                    onYes(val);
                };
                toast.querySelector('#toast-cancel').onclick = () => {
                    toast.remove();
                };
            }
        }

        function requestFullScreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
            document.getElementById('lock-overlay').classList.add('hidden');
        }

        // Keluar dari mode fullscreen secara programmatic
        function exitFullScreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenExit);
        document.addEventListener('webkitfullscreenchange', handleFullscreenExit);
        document.addEventListener('mozfullscreenchange', handleFullscreenExit);
        document.addEventListener('MSFullscreenChange', handleFullscreenExit);

        function handleFullscreenExit() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen && !document.mozFullScreen && !document.msFullscreenElement) {
                if (isExamActive) {
                    forceResetToHome("⚠️ PELANGGARAN: Anda terdeteksi keluar dari mode layar penuh (Fullscreen). Sesi ujian dihentikan.");
                } else {
                    document.getElementById('lock-overlay').classList.remove('hidden');
                }
            }
        }

        function forceResetToHome(reasonMessage) {
            isExamActive = false;
            const iframe = document.getElementById('exam-frame');
            iframe.src = "";
            document.getElementById('view-exam').classList.add('hidden');
            
            // Bersihkan semua toast gantung sebelum kembali ke halaman utama
            clearAllToasts();
            showClass();

            showToast(reasonMessage || "⚠️ PELANGGARAN: Terdeteksi tindakan tidak diizinkan. Sesi ujian dihentikan.");
            document.getElementById('lock-overlay').classList.remove('hidden');
        }

        // ==========================================
        // SOLUSI A: Deteksi Perubahan Ukuran Layar (Split Screen)
        // ==========================================
        window.addEventListener('resize', () => {
            if (isExamActive) {
                // Jika tinggi area tampilan berkurang lebih dari 35% dari layar HP total (karakteristik utama Split Screen)
                if (window.innerHeight < (screen.height * 0.65)) {
                    forceResetToHome("⚠️ PELANGGARAN: Terdeteksi membuka aplikasi lain. Ujian dihentikan.");
                }
            }
        });

        // ==========================================
        // SOLUSI B: Deteksi Visibilitas & Fokus Layar (Tab/App Switch & Split Screen Active)
        // ==========================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isExamActive) {
                forceResetToHome("⚠️ PELANGGARAN: Terdeteksi membuka aplikasi lain. Ujian dihentikan.");
            }
        });

        window.addEventListener('blur', () => {
            if (isExamActive) {
                forceResetToHome("⚠️ PELANGGARAN: Terdeteksi membuka aplikasi lain. Ujian dihentikan.");
            }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                showToast("Peringatan: Aksi atau pintasan tombol dibatasi oleh sistem.");
            }
        });

        function getMapelEmoji(name) {
            const n = name.toLowerCase();
            if (n.includes('matematika') || n.includes('mtk')) return '📐';
            if (n.includes('ipa')) return '🧪';
            if (n.includes('ips')) return '🌍';
            if (n.includes('arab')) return '<img src="https://flagcdn.com/24x18/sa.png" alt="SA" style="width:20px; vertical-align:middle;" />';
            if (n.includes('indo')) return '<img src="https://flagcdn.com/24x18/id.png" alt="ID" style="width:20px; vertical-align:middle;" />';
            if (n.includes('inggris')) return '<img src="https://flagcdn.com/24x18/gb.png" alt="GB" style="width:20px; vertical-align:middle;" />';
            if (n.includes('agama')) return '🕌';
            if (n.includes('pjok')) return '⚽';
            if (n.includes('seni')) return '🎨';
            if (n.includes('tik') || n.includes('informatika')) return '💻';
            return '📚';
        }

        async function showMapel(kelas) {
            try {
                const response = await fetch(FIREBASE_URL);
                if (!response.ok) throw new Error("Gagal mengambil data server");
                
                const data = await response.json();
                if (!data) { 
                    showToast("Belum ada data kuis tersimpan di server."); 
                    return; 
                }

                document.getElementById('view-class').classList.add('hidden');
                const viewMapel = document.getElementById('view-mapel');
                viewMapel.classList.remove('hidden');
                viewMapel.classList.add('animate-view');
                
                document.getElementById('main-title').innerText = "Daftar Mata Pelajaran";
                document.getElementById('school-name').innerText = "Kelas " + kelas;
                document.getElementById('main-desc').innerText = "Silahkan pilih mapel ujian";
                
                const list = document.getElementById('mapel-list');
                list.innerHTML = '';
                
                let visibleCount = 0;
                const mapels = data[kelas] || {};

                for (let m in mapels) {
                    if (mapels[m] && mapels[m].visible) {
                        visibleCount++;
                        const btn = document.createElement('button');
                        btn.className = 'menu-card c-mapel';
                        btn.innerHTML = `<div class="icon">${getMapelEmoji(m)}</div><div class="content"><h2>${m}</h2></div><div class="arrow">🚀</div>`;
                        
                        btn.onclick = () => {
                            let rawLink = mapels[m].link;
                            if (rawLink && rawLink.trim() !== "") {
                                let targetLink = rawLink.trim();
                                if (!targetLink.startsWith('http://') && !targetLink.startsWith('https://')) {
                                    targetLink = 'https://' + targetLink;
                                }
                                openExam(m, targetLink, mapels[m].token || "");
                            } else {
                                showToast("Informasi: Link ujian untuk mata pelajaran ini belum tersedia.");
                            }
                        };
                        list.appendChild(btn);
                    }
                }

                if (visibleCount === 0) {
                    list.innerHTML = "<div style='padding:30px; color:#b2bec3; text-align:center;'>Tidak ada kuis aktif untuk kelas ini.</div>";
                }
            } catch (e) {
                showToast("Gagal terhubung ke server. Periksa kembali koneksi internet Anda.");
            }
        }

        function openExam(mapelName, url, token) {
            isExamActive = true; 
            currentExamToken = token;
            document.getElementById('exam-title-bar').innerText = "Ujian: " + mapelName;
            const iframe = document.getElementById('exam-frame');
            iframe.src = url;
            document.getElementById('view-exam').classList.remove('hidden');
        }

        // Konfirmasi keluar ujian dengan form Prompt (meminta Token)
        function confirmCloseExam() {
            showToast("Masukkan TOKEN untuk keluar dari ujian ini:", 'prompt', (inputToken) => {
                // Jika token benar
                if (inputToken === currentExamToken) {
                    isExamActive = false;
                    const iframe = document.getElementById('exam-frame');
                    iframe.src = ""; 
                    document.getElementById('view-exam').classList.add('hidden');
                    showClass();
                    
                    // Keluar dari mode Fullscreen (menjadi normal) dan tampilkan overlay pembuka kembali
                    exitFullScreen();
                    document.getElementById('lock-overlay').classList.remove('hidden');
                } else {
                    // Jika token salah, tidak ada aksi tutup (halaman tetap full screen)
                    showToast("Token salah! Anda tidak dapat keluar.");
                }
            });
        }

        function showClass() {
            // Bersihkan semua toast berjalan ketika berpindah/kembali ke halaman utama
            clearAllToasts();
            
            document.getElementById('view-mapel').classList.add('hidden');
            document.getElementById('view-class').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Penilaian Sumatif Akhir Tahun";
            document.getElementById('school-name').innerText = "SMP Negeri 3 Babat";
            document.getElementById('main-desc').innerText = "TP 2025/2026";
        }
    </script>
</body>
</html>
